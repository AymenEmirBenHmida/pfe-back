services:
  authentication:
    depends_on:
      - postgresql
      - kafka
    build:
      context: ./authentication
      dockerfile: Dockerfile
      target: production
    ports:
      - "3001:3005"
    env_file:
      - ./authentication/.env
    networks:
      - app-network
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: 1

  gateway:
    depends_on:
      - postgresql
      - kafka
    build:
      context: ./gateway
      dockerfile: Dockerfile
      target: production
    ports:
      - "3002:3006"
    env_file:
      - ./gateway/.env
    networks:
      - app-network
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: 1

  user-microservice:
    depends_on:
      - postgresql
      - kafka
    build:
      context: ./user-microservice
      dockerfile: Dockerfile
      target: production
    ports:
      - "3003:3007"
    env_file:
      - ./user-microservice/.env
    networks:
      - app-network
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: 1

  product-microservice:
    depends_on:
      - postgresql
      - kafka
    build:
      context: ./product-microservice
      dockerfile: Dockerfile
      target: production
    ports:
      - "3004:3008"
    env_file:
      - ./product-microservice/.env
    networks:
      - app-network
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: 1

  order-microservice:
    depends_on:
      - postgresql
      - kafka
    build:
      context: ./order-microservice
      dockerfile: Dockerfile
      target: production
    ports:
      - "3005:3009"
    env_file:
      - ./order-microservice/.env
    networks:
      - app-network
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: 1

  review-microservice:
    depends_on:
      - postgresql
      - kafka
    build:
      context: ./review-microservice
      dockerfile: Dockerfile
      target: production
    ports:
      - "3006:3010"
    env_file:
      - ./review-microservice/.env
    networks:
      - app-network
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: 1

  notification-microservice:
    depends_on:
      - postgresql
      - kafka
    build:
      context: ./notification-microservice
      dockerfile: Dockerfile
      target: production
    ports:
      - "3007:3011"
    env_file:
      - ./notification-microservice/.env
    networks:
      - app-network
    environment:
      KAFKA_BROKERS: kafka:9092
      KAFKAJS_NO_PARTITIONER_WARNING: 1

  postgresql:
    image: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always
    environment:
      POSTGRES_USER: aymen
      POSTGRES_PASSWORD: azert12345
      POSTGRES_DB: authenticationDb
    ports:
      - "5432:5432"
    networks:
      - app-network

  zookeeper:
    image: confluentinc/cp-zookeeper:latest
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - app-network

  kafka:
    image: confluentinc/cp-kafka:latest
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
